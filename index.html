<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="叶子">
<title>叶子</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+SC:wght@300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#eef3f8;--surface:rgba(255,255,255,0.75);--border:rgba(140,165,195,0.25);--text-primary:#1a2535;--text-secondary:rgba(26,37,53,0.6);--text-muted:rgba(26,37,53,0.35);--accent:#2a5a9a;--accent-warm:#4a7ab8;--accent-light:#8aaad0;}
html,body{height:100%;background:var(--bg);color:var(--text-primary);font-family:'Noto Serif SC',serif;overflow:hidden}
.app{height:100dvh;display:flex;flex-direction:column;position:relative;background:var(--bg);overflow:hidden}
.setup-screen{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:40px 32px}
.setup-screen.hidden{display:none}
.setup-avatar{width:76px;height:76px;border-radius:50%;object-fit:cover;object-position:center 20%;border:2px solid rgba(42,90,154,.2)}
.setup-title{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:300;letter-spacing:.15em;text-align:center}
.setup-sub{font-size:11px;color:var(--text-muted);letter-spacing:.08em;text-align:center;margin-top:4px;line-height:1.8}
.setup-fields{width:100%;display:flex;flex-direction:column;gap:12px}
.setup-field{display:flex;flex-direction:column;gap:5px}
.setup-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);font-family:'Cormorant Garamond',serif}
.setup-input{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px;color:var(--text-primary);font-family:'Noto Serif SC',serif;font-size:14px;outline:none;width:100%;caret-color:var(--accent)}
.setup-input::placeholder{color:var(--text-muted)}
.setup-input:focus{border-color:rgba(42,90,154,.4)}
.setup-btn{width:100%;padding:14px;background:#1a4a8a;border:none;border-radius:12px;color:#fff;font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:300;letter-spacing:.12em;cursor:pointer;text-align:center}
.setup-btn:active{opacity:.85}
.setup-error{font-size:11px;color:#a05040;text-align:center;height:16px}
.header{position:relative;z-index:10;padding:env(safe-area-inset-top,44px) 20px 0;display:flex;flex-direction:column;align-items:center;background:var(--bg)}
.profile-section{display:flex;flex-direction:column;align-items:center;padding:14px 0 10px;gap:8px}
.avatar-wrap{position:relative;width:60px;height:60px}
.avatar{width:60px;height:60px;border-radius:50%;object-fit:cover;object-position:center 20%;border:2px solid rgba(42,90,154,.2)}
.avatar-ring{position:absolute;inset:-3px;border-radius:50%;border:1.5px solid rgba(42,90,154,.2);animation:pulse-ring 3s ease-in-out infinite}
@keyframes pulse-ring{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:.8;transform:scale(1.04)}}
.name{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:300;letter-spacing:.14em}
.info-strip{width:100%;display:flex;gap:7px;padding:0 20px 10px;overflow-x:auto;scrollbar-width:none}
.info-strip::-webkit-scrollbar{display:none}
.info-card{flex-shrink:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:7px 11px;min-width:80px;display:flex;flex-direction:column;gap:2px}
.info-label{font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-muted);font-family:'Cormorant Garamond',serif}
.info-value{font-size:11px;color:var(--text-secondary);line-height:1.4}
.info-value.accent{color:var(--accent)}
.info-value.warm{color:var(--accent-warm)}
.os-card{width:calc(100% - 40px);margin:0 20px 8px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 13px;display:none}
.os-card.visible{display:block}
.os-text{font-size:11px;color:var(--text-muted);line-height:1.6;font-style:italic}
.divider{width:calc(100% - 40px);margin:0 20px 2px;height:1px;background:var(--border)}
.os-toggle{position:absolute;right:20px;top:0;font-size:9px;color:var(--text-muted);letter-spacing:.12em;font-family:'Cormorant Garamond',serif;cursor:pointer;padding:4px 0;text-transform:uppercase}
.messages{flex:1;overflow-y:auto;padding:10px 20px 10px;display:flex;flex-direction:column;gap:9px;position:relative;z-index:10;scrollbar-width:none}
.messages::-webkit-scrollbar{display:none}
.msg{display:flex;flex-direction:column;max-width:72%;animation:msg-in .25s ease-out}
@keyframes msg-in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.msg.user{align-self:flex-end;align-items:flex-end}
.msg.yezi{align-self:flex-start;align-items:flex-start;max-width:58%}
.bubble{padding:9px 13px;border-radius:16px;font-size:14px;line-height:1.65}
.msg.user .bubble{background:rgba(42,90,154,.1);border:1px solid rgba(42,90,154,.15);color:var(--text-primary);border-bottom-right-radius:3px}
.msg.yezi .bubble{background:rgba(255,255,255,.85);border:1px solid var(--border);color:var(--text-primary);border-bottom-left-radius:3px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.msg-time{font-size:9px;color:var(--text-muted);margin-top:3px;font-family:'Cormorant Garamond',serif}
.typing{display:none;align-self:flex-start;padding:9px 13px;background:rgba(255,255,255,.85);border:1px solid var(--border);border-radius:16px;border-bottom-left-radius:3px;gap:4px;align-items:center}
.typing.show{display:flex}
.dot{width:5px;height:5px;background:var(--accent-light);border-radius:50%;animation:bounce 1.2s ease-in-out infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
.date-together{font-family:'Cormorant Garamond',serif;font-size:10px;color:var(--text-muted);text-align:center;letter-spacing:.08em;padding:4px 0 6px}
.input-area{position:relative;z-index:10;padding:8px 20px;padding-bottom:max(env(safe-area-inset-bottom,16px),12px);display:flex;align-items:flex-end;gap:10px;border-top:1px solid var(--border);background:rgba(238,243,248,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.input-wrap{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:9px 15px;display:flex;align-items:center}
textarea{flex:1;background:none;border:none;outline:none;color:var(--text-primary);font-family:'Noto Serif SC',serif;font-size:14px;line-height:1.5;resize:none;max-height:100px;caret-color:var(--accent)}
textarea::placeholder{color:var(--text-muted)}
.send-btn{width:38px;height:38px;border-radius:50%;background:#1a4a8a;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;box-shadow:0 2px 8px rgba(26,74,138,.3)}
.send-btn:active{transform:scale(.92);opacity:.85}
.send-btn svg{width:15px;height:15px;fill:#fff}

/* 🛡️ 核心修复：人物缩小适配 & 拖拽支持 */
#yezi-figure {
  width: 30vw; /* 视口宽度的 30% */
  height: auto;
  position: fixed;
  bottom: 12vh; /* 距离底部 12% */
  left: 35vw; /* 居中定位 (50vw - 15vw) 避免和拖拽代码冲突 */
  z-index: 100;
  cursor: grab; /* 提示可以拖拽 */
}
#yezi-figure:active {
  cursor: grabbing;
}

@keyframes fig-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
#char-bubble{position:fixed;z-index:21;background:rgba(255,255,255,.95);border:1px solid var(--border);border-radius:12px 12px 2px 12px;padding:7px 12px;font-size:12px;color:var(--text-secondary);font-family:'Noto Serif SC',serif;max-width:110px;line-height:1.5;box-shadow:0 2px 8px rgba(0,0,0,.08);opacity:0;transition:opacity .25s;pointer-events:none;bottom:210px;right:122px;}
#char-bubble.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <div class="setup-screen" id="setup-screen">
    <img src="./image_ee6f83.jpg" class="setup-avatar" id="setup-avatar-img">
    <div class="setup-title">叶子</div>
    <div class="setup-sub">请输入你的名字和密码</div>
    <div class="setup-fields">
      <input type="text" id="name-input" class="setup-input" placeholder="你的名字">
      <input type="password" id="key-input" class="setup-input" placeholder="密码 (1208)">
      <button id="setup-btn" class="setup-btn">进入</button>
      <div id="setup-error" class="setup-error"></div>
    </div>
  </div>

  <div class="header">
    <div class="profile-section">
      <div class="avatar-wrap">
        <div class="avatar-ring"></div>
        <img src="./image_ee6f83.jpg" class="avatar" id="yezi-img">
      </div>
      <div class="name">叶子</div>
    </div>
    <div class="info-strip">
      <div class="info-card">
        <div class="info-label">在一起</div>
        <div class="info-value accent" id="days-together">第 0 天</div>
      </div>
      <div class="info-card">
        <div class="info-label">天气</div>
        <div class="info-value" id="weather-val">获取中...</div>
      </div>
      <div class="info-card">
        <div class="info-label">在做</div>
        <div class="info-value warm" id="mood-val">发呆</div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="os-toggle" id="os-toggle" onclick="toggleOS()">内心</div>
    <div class="os-card" id="os-card">
      <div class="os-text" id="os-text">...</div>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="typing" id="typing">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-wrap">
      <textarea id="input" rows="1" placeholder="说点什么..." oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
    </div>
    <div class="send-btn" id="send-btn">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </div>
  </div>
</div>

<img src="./image_ee6f83.jpg" id="yezi-figure">
<div id="char-bubble"></div>

<script>
// 🛡️ 补充缺失的全局变量，防止报错白屏
let USER_NAME = "";
let history = [];
const START_DATE = new Date("2024-03-27"); 
let isAnimating = false;
let atEnd = false;
let bubbleTimer;
const FRAMES_FORWARD = ["./image_ee6f83.jpg"];
const FRAMES_BACKWARD = ["./image_ee6f83.jpg"];
const PHRASES = {
  0: ["怎么了？", "我在听。"],
  5: ["嗯？", "看着你呢。"]
};

function showBubble(text) {
  const b = document.getElementById("char-bubble");
  b.textContent = text;
  b.classList.add("show");
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => b.classList.remove("show"), 2500);
}

async function playAnimation(frameList) {
  isAnimating = true;
  for (const src of frameList) {
    document.getElementById("yezi-figure").src = src; // 统一修改为作用于大图
    await sleep(300);
  }
  isAnimating = false;
}

function onCharClick() {
  if (isAnimating) return;
  if (!atEnd) {
    atEnd = true;
    playAnimation(FRAMES_FORWARD);
    const p = PHRASES[5] || ["..."];
    setTimeout(() => showBubble(p[Math.floor(Math.random()*p.length)]), 300*FRAMES_FORWARD.length);
  } else {
    atEnd = false;
    playAnimation(FRAMES_BACKWARD);
    const p = PHRASES[0] || ["..."];
    setTimeout(() => showBubble(p[Math.floor(Math.random()*p.length)]), 300*FRAMES_BACKWARD.length);
  }
}

// 绑定点击对话事件
const figEl = document.getElementById("yezi-figure");
let figTouched = false;
figEl.addEventListener("click", function(e) {
  if (!isDragging) onCharClick(); // 如果不是在拖动，就触发对话
});

document.getElementById("setup-btn").addEventListener("click", handleSetup);
document.getElementById("send-btn").addEventListener("click", sendMessage);

function init() {
  document.getElementById("yezi-img").src = FRAMES_FORWARD[0];
  document.getElementById("setup-screen").classList.remove("hidden");
  updateDays(); fetchWeather();
}
init();

// === 登录与记忆加载逻辑 ===
function handleSetup() {
  const name = document.getElementById("name-input").value.trim();
  const pwd = document.getElementById("key-input").value.trim();
  
  if (!name) { document.getElementById("setup-error").textContent = "告诉我你叫什么"; return; }
  if (pwd !== "1208") { document.getElementById("setup-error").textContent = "密码不对哦"; return; }
  
  USER_NAME = name; 
  document.getElementById("setup-screen").classList.add("hidden");

  const savedHistory = localStorage.getItem("yezi_chat_history_" + name);
  if (savedHistory) {
    history = JSON.parse(savedHistory);
    history.forEach(msg => {
      addBubble(msg.role === "user" ? "user" : "yezi", msg.content, false);
    });
    addBubble("yezi", "欢迎回来，" + name + "。我们继续聊吧？", true);
  } else {
    setTimeout(() => sendGreeting(name), 500);
  }
}

function saveToLocal() {
  if (USER_NAME) {
    localStorage.setItem("yezi_chat_history_" + USER_NAME, JSON.stringify(history));
  }
}

async function sendGreeting(name) {
  document.getElementById("typing").classList.add("show");
  try {
    const prompt = `你叫叶子，是她的伴侣，男性，温柔。伴侣「${name}」刚来找你。请主动打招呼，必须呼唤名字「${name}」，简短1-2句。`;
    const res = await fetch("/api/chat", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ messages: [{role: "user", content: prompt}], maxTokens: 150 })
    });
    const data = await res.json();
    const reply = data.choices?.[0]?.message?.content || ("嗯，" + name + "来了。");
    document.getElementById("typing").classList.remove("show");
    
    const parts = reply.split(/([。？！；…\n]+)/g).filter(s => s.trim().length > 0);
    let combined = [];
    for (let i = 0; i < parts.length; i += 2) { combined.push((parts[i] + (parts[i+1] || "")).trim()); }

    for (let i=0; i<combined.length; i++) {
      if (i>0) { document.getElementById("typing").classList.add("show"); await sleep(600); document.getElementById("typing").classList.remove("show"); }
      addBubble("yezi", combined[i]);
    }
    history.push({role:"assistant", content:reply});
    saveToLocal();
  } catch(e) {
    document.getElementById("typing").classList.remove("show");
    addBubble("yezi", "嗯，" + name + "，你来了。");
  }
}

function addBubble(role, text, shouldScroll = true) {
  const container=document.getElementById("messages");
  const typing=document.getElementById("typing");
  const msg=document.createElement("div");
  msg.className="msg "+role;
  const now=new Date();
  const time=now.getHours().toString().padStart(2,"0")+":"+now.getMinutes().toString().padStart(2,"0");
  msg.innerHTML='<div class="bubble">'+text.replace(/</g,"&lt;")+'</div><div class="msg-time">'+time+'</div>';
  container.insertBefore(msg, typing);
  if (shouldScroll) container.scrollTop=container.scrollHeight;
}

async function sendMessage() {
  const input=document.getElementById("input");
  const text=input.value.trim();
  if(!text) return;
  input.value=""; autoResize(input);
  history.push({role:"user",content:text});
  addBubble("user",text);
  document.getElementById("typing").classList.add("show");
  
  try {
    const SYSTEM = `你叫叶子，是她的伴侣，男性，温柔。根据她的话语调整回应。不承认是AI。`;
    const nameHint = `\n注意：她的名字是「${USER_NAME}」。`;
    const ctx=history.slice(-15).map(m=>(m.role==="user"?"她":"你")+"："+m.content).join("\n");
    const prompt= SYSTEM + nameHint + "\n\n历史对话：\n" + ctx + "\n\n她刚说：" + text + "\n\n你回复：";
    
    const res = await fetch("/api/chat", {
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ messages:[{role:"user", content:prompt}], maxTokens:600 })
    });
    const data = await res.json();
    const reply = data.choices?.[0]?.message?.content || "……";
    document.getElementById("typing").classList.remove("show");

    const sentences = reply.split(/([。？！；…\n]+)/g).filter(s => s.trim().length > 0);
    let combinedSentences = [];
    for (let i = 0; i < sentences.length; i += 2) {
      combinedSentences.push((sentences[i] + (sentences[i+1] || "")).trim());
    }

    for (let i = 0; i < combinedSentences.length; i++) {
      const part = combinedSentences[i];
      if (!part) continue;
      if (i > 0) { document.getElementById("typing").classList.add("show"); await sleep(700 + part.length * 80); document.getElementById("typing").classList.remove("show"); }
      addBubble("yezi", part);
    }

    history.push({role:"assistant",content:reply});
    saveToLocal();
    updateMood(reply);
  } catch(e) {
    document.getElementById("typing").classList.remove("show");
    addBubble("yezi","网络似乎开小差了...");
  }
}

function updateDays() {
  const diff = Math.floor((new Date()-START_DATE)/86400000)+1;
  document.getElementById("days-together").textContent="第 "+diff+" 天";
}

async function fetchWeather() {
  try {
    const r = await fetch("https://api.open-meteo.com/v1/forecast?latitude=22.3193&longitude=114.1694&current=temperature_2m,weathercode&timezone=Asia/Hong_Kong");
    const d = await r.json();
    const temp=d.current.temperature_2m, code=d.current.weathercode;
    const descs={0:"晴",1:"多云",2:"多云",3:"阴",45:"有雾",51:"小雨",61:"下雨",80:"阵雨",95:"雷暴"};
    document.getElementById("weather-val").textContent=(descs[code]||"—")+" "+temp+"°";
  }catch(e){}
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

function updateMood(reply){
  const moods=[{kw:["想你","想念"],mood:"想你了"},{kw:["累","困"],mood:"有点累"},{kw:["开心","哈哈"],mood:"心情不错"},{kw:["担心","关心"],mood:"在想你"}];
  for(const m of moods){if(m.kw.some(k=>reply.includes(k))){document.getElementById("mood-val").textContent=m.mood;break;}}
}

let osVisible=false;
function toggleOS(){
  osVisible=!osVisible;
  document.getElementById("os-card").classList.toggle("visible",osVisible);
  document.getElementById("os-toggle").textContent=osVisible?"收起":"内心";
  if(osVisible) fetchOS();
}

async function fetchOS() {
  if (history.length === 0) {
    document.getElementById("os-text").textContent = "还没有想法……";
    return;
  }
  try {
    const ctx = history.slice(-6).map(m => (m.role === "user" ? "她" : "你") + "：" + m.content).join(" | ");
    const prompt = "你是叶子，根据最近对话写一段真实内心想法。50字以内。对话：" + ctx;
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: [{ role: "user", content: prompt }], maxTokens: 150 })
    });
    const data = await res.json();
    document.getElementById("os-text").textContent = data.choices?.[0]?.message?.content || "叶子正在发呆...";
  } catch (error) {
    document.getElementById("os-text").textContent = "网络似乎开小差了...";
  }
}

function autoResize(el){el.style.height="auto";el.style.height=Math.min(el.scrollHeight,100)+"px";}
function handleKey(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}}

// === 角色拖动逻辑 ===
const dragEl = document.getElementById("yezi-figure");
let isDragging = false;
let startX, startY, initialX, initialY;

const dragStart = (e) => {
  if (e.target !== dragEl) return;
  isDragging = false; // 初始按下不算拖拽
  startX = e.type === "touchstart" ? e.touches[0].clientX : e.clientX;
  startY = e.type === "touchstart" ? e.touches[0].clientY : e.clientY;
  
  const rect = dragEl.getBoundingClientRect();
  initialX = rect.left;
  initialY = rect.top;
};

const dragMove = (e) => {
  if (startX === undefined || startY === undefined) return; // 没按下就不管
  
  const currentX = e.type === "touchmove" ? e.touches[0].clientX : e.clientX;
  const currentY = e.type === "touchmove" ? e.touches[0].clientY : e.clientY;
  
  const dx = currentX - startX;
  const dy = currentY - startY;
  
  // 如果移动距离超过 5 像素，才判定为拖拽（防止误触点击）
  if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
    isDragging = true;
    e.preventDefault(); // 阻止滚动
    dragEl.style.left = (initialX + dx) + "px";
    dragEl.style.top = (initialY + dy) + "px";
    dragEl.style.bottom = "auto"; 
    dragEl.style.right = "auto";
  }
};

const dragEnd = () => {
  setTimeout(() => { isDragging = false; }, 50); // 延迟重置，防止触发点击
  startX = undefined;
  startY = undefined;
};

dragEl.addEventListener("mousedown", dragStart);
window.addEventListener("mousemove", dragMove, { passive: false });
window.addEventListener("mouseup", dragEnd);

dragEl.addEventListener("touchstart", dragStart, { passive: false });
window.addEventListener("touchmove", dragMove, { passive: false });
window.addEventListener("touchend", dragEnd);

</script>
</body>
</html>
