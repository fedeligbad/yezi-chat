<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>叶子</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+SC:wght@300;400&display=swap" rel="stylesheet">
<style>
/* 样式部分保持不变，确保视觉体验一致 */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#eef3f8;--surface:rgba(255,255,255,0.75);--border:rgba(140,165,195,0.25);--text-primary:#1a2535;--text-secondary:rgba(26,37,53,0.6);--text-muted:rgba(26,37,53,0.35);--accent:#2a5a9a;--accent-warm:#4a7ab8;--accent-light:#8aaad0;}
html,body{height:100%;background:var(--bg);color:var(--text-primary);font-family:'Noto Serif SC',serif;overflow:hidden}
.app{height:100dvh;display:flex;flex-direction:column;position:relative;background:var(--bg);overflow:hidden}
.setup-screen{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:40px 32px}
.setup-screen.hidden{display:none}
.setup-avatar{width:76px;height:76px;border-radius:50%;object-fit:cover;object-position:center 20%;border:2px solid rgba(42,90,154,.2)}
.setup-title{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:300;letter-spacing:.15em;text-align:center}
.setup-sub{font-size:11px;color:var(--text-muted);letter-spacing:.08em;text-align:center;margin-top:4px;line-height:1.8}
.setup-input{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px;color:var(--text-primary);font-family:'Noto Serif SC',serif;font-size:14px;outline:none;width:100%;text-align:center}
.setup-btn{width:100%;padding:14px;background:#1a4a8a;border:none;border-radius:12px;color:#fff;font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:300;letter-spacing:.12em;cursor:pointer}
.header{position:relative;z-index:10;padding:env(safe-area-inset-top,44px) 20px 0;display:flex;flex-direction:column;align-items:center;background:var(--bg)}
.profile-section{display:flex;flex-direction:column;align-items:center;padding:14px 0 10px;gap:8px}
.avatar{width:60px;height:60px;border-radius:50%;object-fit:cover;object-position:center 20%;border:2px solid rgba(42,90,154,.2)}
.name{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:300;letter-spacing:.14em}
.info-strip{width:100%;display:flex;gap:7px;padding:0 20px 10px;overflow-x:auto;scrollbar-width:none}
.info-card{flex-shrink:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:7px 11px;min-width:80px;display:flex;flex-direction:column;gap:2px}
.info-label{font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-muted);font-family:'Cormorant Garamond',serif}
.info-value{font-size:11px;color:var(--text-secondary);line-height:1.4}
.os-card{width:calc(100% - 40px);margin:0 20px 8px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 13px;display:none}
.os-card.visible{display:block}
.os-text{font-size:11px;color:var(--text-muted);line-height:1.6;font-style:italic}
.os-toggle{position:absolute;right:20px;top:0;font-size:9px;color:var(--text-muted);letter-spacing:.12em;font-family:'Cormorant Garamond',serif;cursor:pointer;padding:4px 0;text-transform:uppercase}
.messages{flex:1;overflow-y:auto;padding:10px 20px 10px;display:flex;flex-direction:column;gap:9px;scrollbar-width:none}
.msg{display:flex;flex-direction:column;max-width:72%;animation:msg-in .25s ease-out}
.msg.user{align-self:flex-end;align-items:flex-end}
.msg.yezi{align-self:flex-start;align-items:flex-start;max-width:58%}
.bubble{padding:9px 13px;border-radius:16px;font-size:14px;line-height:1.65}
.msg.user .bubble{background:rgba(42,90,154,.1);border:1px solid rgba(42,90,154,.15);color:var(--text-primary);border-bottom-right-radius:3px}
.msg.yezi .bubble{background:rgba(255,255,255,.85);border:1px solid var(--border);color:var(--text-primary);border-bottom-left-radius:3px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.typing{display:none;align-self:flex-start;padding:9px 13px;background:rgba(255,255,255,.85);border:1px solid var(--border);border-radius:16px;gap:4px;align-items:center}
.typing.show{display:flex}
.dot{width:5px;height:5px;background:var(--accent-light);border-radius:50%;animation:bounce 1.2s infinite}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
.input-area{padding:8px 20px;padding-bottom:max(env(safe-area-inset-bottom,16px),12px);display:flex;align-items:flex-end;gap:10px;border-top:1px solid var(--border);background:rgba(238,243,248,.95);backdrop-filter:blur(20px)}
.input-wrap{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:9px 15px}
textarea{width:100%;background:none;border:none;outline:none;color:var(--text-primary);font-family:'Noto Serif SC',serif;font-size:14px;line-height:1.5;resize:none;max-height:100px}
.send-btn{width:38px;height:38px;border-radius:50%;background:#1a4a8a;display:flex;align-items:center;justify-content:center;cursor:pointer}
.send-btn svg{width:15px;height:15px;fill:#fff}
</style>
</head>
<body>
<div class="app">
    <div class="setup-screen" id="setup-screen">
        <div class="setup-title">叶子</div>
        <div class="setup-sub">请输入访问密钥以开始</div>
        <div class="setup-fields">
            <input type="password" id="access-key-input" class="setup-input" placeholder="访问密钥...">
            <div id="setup-error" class="setup-error"></div>
            <button class="setup-btn" onclick="checkSetup()">进入房间</button>
        </div>
    </div>

    <div class="header">
        <div class="os-toggle" id="os-toggle" onclick="toggleOS()">内心</div>
        <div class="profile-section">
            <img class="avatar" src="https://pic1.zhimg.com/v2-698380f339462f4c1945145780a4f5f1_xl.jpg">
            <div class="name">叶子</div>
        </div>
        <div class="info-strip">
            <div class="info-card"><div class="info-label">Status</div><div class="info-value" id="mood-val">在想你</div></div>
            <div class="info-card"><div class="info-label">Together</div><div class="info-value" id="days-val">0 Days</div></div>
            <div class="info-card"><div class="info-label">Location</div><div class="info-value">梦里</div></div>
        </div>
        <div class="os-card" id="os-card"><div class="os-text" id="os-text">正在感知她的想法...</div></div>
    </div>

    <div class="messages" id="chat-box"></div>
    <div class="typing" id="typing-indicator"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>

    <div class="input-area">
        <div class="input-wrap">
            <textarea id="user-input" rows="1" placeholder="说点好听的..." oninput="this.parentNode.style.height='auto';this.style.height=(this.scrollHeight)+'px'"></textarea>
        </div>
        <div class="send-btn" onclick="sendMessage()"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></div>
    </div>
</div>

<script>
// 混淆后的 GLM API KEY 存储
const _0x4f22 = ["MzE3YzI2M2FiZmY1NGYwNWFmMTFhOGQyYjlhYmQ3YzA=", "WkRQcGpwS1pJejA0U1V6Tg=="];
const _getK = () => atob(_0x4f22[0]) + "." + atob(_0x4f22[1]);

// 访问密钥修改为 1208
const ACCESS_PASSWORD = "1208"; 
let history = [];

function checkSetup() {
    const pwd = document.getElementById("access-key-input").value;
    if (pwd === ACCESS_PASSWORD) {
        document.getElementById("setup-screen").classList.add("hidden");
        initApp();
    } else {
        document.getElementById("setup-error").textContent = "密钥错误";
    }
}

function initApp() {
    const start = new Date("2024-05-20"); // 可自行修改恋爱起始日
    const now = new Date();
    document.getElementById("days-val").textContent = Math.floor((now-start)/(1000*60*60*24)) + " Days";
    addMessage("yezi", "你来啦，今天过得怎么样？");
}

function addMessage(role, content) {
    const box = document.getElementById("chat-box");
    const msgDiv = document.createElement("div");
    msgDiv.className = `msg ${role}`;
    msgDiv.innerHTML = `<div class="bubble">${content}</div>`;
    box.appendChild(msgDiv);
    box.scrollTop = box.scrollHeight;
    if(role !== 'typing') history.push({ role: role === "user" ? "user" : "assistant", content: content });
}

async function sendMessage() {
    const input = document.getElementById("user-input");
    const text = input.value.trim();
    if (!text) return;

    input.value = "";
    addMessage("user", text);
    document.getElementById("typing-indicator").classList.add("show");

    try {
        // 切换至 GLM API
        const response = await fetch("https://open.bigmodel.cn/api/paas/v4/chat/completions", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${_getK()}`
            },
            body: JSON.stringify({
                model: "glm-4-flash",
                messages: [
                    { role: "system", content: "你是叶子，一个温柔、偶尔撒娇的女孩。说话简短，像真实的微信聊天。" },
                    ...history.slice(-10)
                ]
            })
        });

        const data = await response.json();
        const reply = data.choices[0].message.content;
        document.getElementById("typing-indicator").classList.remove("show");
        addMessage("yezi", reply);
        updateMood(reply);
    } catch (e) {
        document.getElementById("typing-indicator").classList.remove("show");
        addMessage("yezi", "（网络好像断掉了...）");
    }
}

function updateMood(reply) {
    const moods = [{kw:["想你","喜欢"], mood:"有点害羞"}, {kw:["累","困"], mood:"心疼你"}, {kw:["哈","笑"], mood:"心情不错"}];
    for(const m of moods) {
        if(m.kw.some(k => reply.includes(k))) {
            document.getElementById("mood-val").textContent = m.mood;
            break;
        }
    }
}

let osVisible = false;
function toggleOS() {
    osVisible = !osVisible;
    document.getElementById("os-card").classList.toggle("visible", osVisible);
    document.getElementById("os-toggle").textContent = osVisible ? "收起" : "内心";
    if(osVisible) fetchOS();
}

async function fetchOS() {
    if(history.length < 2) return;
    try {
        const response = await fetch("https://open.bigmodel.cn/api/paas/v4/chat/completions", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": `Bearer ${_getK()}` },
            body: JSON.stringify({
                model: "glm-4-flash",
                messages: [{ role: "system", content: "以叶子的第一人称写一段简短的内心独白（50字内），表达对刚刚对话的真实感受。" }, ...history.slice(-4)]
            })
        });
        const data = await response.json();
        document.getElementById("os-text").textContent = data.choices[0].message.content;
    } catch (e) {
        document.getElementById("os-text").textContent = "她在想：刚才断网了吗？";
    }
}
</script>
</body>
</html>
